name: iOS Simulator Build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project and app icon
        run: bash ios/scripts/bootstrap.sh
      - name: Compile for iPhone Simulator (no signing required)
        run: |
          xcodebuild \
            -project ios/TigerSportsLive.xcodeproj \
            -scheme TigerSportsLive \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
