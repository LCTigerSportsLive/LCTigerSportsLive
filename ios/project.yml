name: TigerSportsLive
options:
  bundleIdPrefix: com.tigersportslive
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  TigerSportsLive:
    type: application
    platform: iOS
    sources:
      - path: TigerSportsLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tigersportslive.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Tiger Sports Live"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
schemes:
  TigerSportsLive:
    build:
      targets:
        TigerSportsLive: all
    run:
      config: Debug
    archive:
      config: Release
